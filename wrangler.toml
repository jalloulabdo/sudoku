# Cloudflare Pages project: static site in dist/ + API in functions/ (Pages Functions) + D1.
# Setup steps are in README.md ("Deploying to Cloudflare").
name = "sudoku-master"
pages_build_output_dir = "dist"
compatibility_date = "2026-05-01"

[vars]
APP_ENV = "production"

[[d1_databases]]
binding = "DB"
database_name = "sudoku-master"
# Replace with the id printed by `npx wrangler d1 create sudoku-master`.
database_id = "e9955e5c-ac39-4afc-b289-56acc58e427e"
migrations_dir = "migrations"
